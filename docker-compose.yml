services:
  db:
    image: postgres:15-alpine
    container_name: cloudvault-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: cloudvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudvault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cloudvault-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: cloudvault-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cloudvault_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - cloudvault-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.59
    container_name: cloudvault-seaweedfs
    restart: always
    ports:
      - "9333:9333"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    command: server -dir=/data -filer -s3 -s3.port=8333
    networks:
      - cloudvault-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: cloudvault-garage
    restart: always
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - cloudvault-network
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage-init:
    image: dxflrs/garage:v1.0.1
    container_name: cloudvault-garage-init
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./docker/garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - cloudvault-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudvault-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/cloudvault
      - REDIS_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - MOCK_STORAGE=False
      - MINIO_ENDPOINT=http://minio:9000
      - SEAWEEDFS_FILER_URL=http://seaweedfs:8333
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY_ID=GK000000000000000000000001
      - GARAGE_SECRET_ACCESS_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - GARAGE_BUCKET_NAME=cloudvault-archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - cloudvault-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudvault-celery-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/cloudvault
      - REDIS_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - MOCK_STORAGE=False
      - MINIO_ENDPOINT=http://minio:9000
      - SEAWEEDFS_FILER_URL=http://seaweedfs:8333
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY_ID=GK000000000000000000000001
      - GARAGE_SECRET_ACCESS_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - GARAGE_BUCKET_NAME=cloudvault-archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - cloudvault-network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudvault-celery-beat
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/cloudvault
      - REDIS_URL=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - MOCK_STORAGE=False
      - MINIO_ENDPOINT=http://minio:9000
      - SEAWEEDFS_FILER_URL=http://seaweedfs:8333
      - GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_ACCESS_KEY_ID=GK000000000000000000000001
      - GARAGE_SECRET_ACCESS_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - GARAGE_BUCKET_NAME=cloudvault-archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - cloudvault-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudvault-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cloudvault-network

networks:
  cloudvault-network:
    name: cloudvault-network
    driver: bridge

volumes:
  postgres-data:
    name: cloudvault-postgres-data
  redis-data:
    name: cloudvault-redis-data
  minio-data:
    name: cloudvault-minio-data
  seaweedfs-data:
    name: cloudvault-seaweedfs-data
  garage-meta:
    name: cloudvault-garage-meta
  garage-data:
    name: cloudvault-garage-data
